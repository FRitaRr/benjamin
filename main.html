document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element \u2014 warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags \u2014 manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames \u2014 from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below \u2014 so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // \u2500\u2500 Nested-page text protocol (parent-chain relay) \u2500\u2500
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document \u2014 a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts \u2014 file:// \u2014 everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) \u2014 location.origin is
    // computed from the URL and stays 'https://\u2026' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match \u2014 accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative \u2014 never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate \u2014 a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') \u2014 an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent \u2014 the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs \u2014
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here \u2014 they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin \u2014 blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec \u2014 re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page \u2014 from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Emploi du temps PSI<\u002Ftitle>\n<meta name=\"theme-color\" content=\"#0d1013\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-title\" content=\"Prepa PSI\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<script src=\"acabd87c-a4aa-4370-afee-68bd89da127a\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet data-dc-atomics=\"\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<style>\n:root{--f:system-ui,-apple-system,\"Segoe UI\",Helvetica,Arial,sans-serif;--fm:ui-monospace,SFMono-Regular,\"SF Mono\",Menlo,Consolas,monospace;--bg:#0d1013;--surf:#15191d;--surf2:#1b2126;--surf3:#232a30;--bord:rgba(255,255,255,.09);--tx:#e9edef;--tx2:#98a3aa;--tx3:#5f6a72;--calme:#111a1a;--ok:#4a9e74;--dang:#c0553f}\n[data-th=\"clair\"]{--bg:#f3f1ed;--surf:#ffffff;--surf2:#eae7e1;--surf3:#dfdbd3;--bord:rgba(0,0,0,.11);--tx:#14181b;--tx2:#5d666c;--tx3:#8d959b;--calme:#e9efea;--ok:#2f7d57;--dang:#a8402c}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbody{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);overscroll-behavior:none}\nbutton{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}\ninput{font-family:inherit;color:inherit}\na{color:var(--tx)}\na:hover{color:var(--tx2)}\n@keyframes bat{0%,100%{opacity:1}50%{opacity:.35}}\n::-webkit-scrollbar{width:0;height:0}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div data-th=\"{{ theme }}\" style=\"min-height:100dvh;background:var(--bg);color:var(--tx);display:flex;justify-content:center\">\n<div style=\"width:100%;max-width:520px;min-height:100dvh;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg);color:var(--tx);overflow:hidden\">\n\n  <div style=\"flex:none;display:flex;align-items:center;gap:10px;padding:13px 14px 9px\">\n    <div style=\"font:600 15px/1 var(--fm);letter-spacing:.02em;color:var(--tx)\">{{ heure }}<\u002Fdiv>\n    <div style=\"font:500 11px/1.2 var(--f);color:var(--tx2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ dateLongue }}<\u002Fdiv>\n    <button sc-camel-on-click=\"{{ basculerRechPanneau }}\" style=\"flex:none;height:34px;padding:0 9px;border-radius:11px;background:{{ bgRechReg }};font:600 11px var(--fm);color:{{ colRechReg }};white-space:nowrap\">\u23f1 {{ rechDureeTxt }}<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ basculerTheme }}\" style=\"flex:none;width:34px;height:34px;border-radius:11px;background:var(--surf2);font:500 13px var(--f);color:var(--tx2)\">{{ iconeTheme }}<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ allerReglages }}\" style=\"flex:none;height:34px;padding:0 11px;border-radius:11px;background:var(--surf2);font:600 10.5px var(--f);color:var(--tx2);letter-spacing:.05em\">R\u00c9GL.<\u002Fbutton>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ rechPanneau }}\">\n  <div style=\"flex:none;display:flex;align-items:center;gap:4px;padding:0 14px 10px\">\n    <div style=\"flex:none;font:700 8.5px/1 var(--fm);letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);margin-right:2px\">Recherche<\u002Fdiv>\n    <div style=\"flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;padding:1px 0\">\n      <sc-for list=\"{{ rechPresets }}\" as=\"p\" hint-placeholder-count=\"6\">\n        <button sc-camel-on-click=\"{{ p.choisir }}\" style=\"flex:none;height:28px;padding:0 10px;border-radius:8px;background:{{ p.bg }};border:1px solid {{ p.bord }};font:600 11px var(--fm);color:{{ p.col }};white-space:nowrap\">{{ p.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ rechMoins }}\" st var(--tx)\">Volume<\u002Fdiv>\n          <input type=\"range\" min=\"0\" max=\"1\" step=\"0.05\" value=\"{{ volume }}\" sc-camel-on-change=\"{{ majVolume }}\" style=\"flex:1;min-width:0;accent-color:var(--tx2)\">\n          <div style=\"flex:none;width:32px;text-align:right;font:500 9.5px/1.3 var(--fm);color:var(--tx3)\">{{ volumeTexte }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:4px;padding:0 12px 10px\">\n          <sc-for list=\"{{ testsSon }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ t.jouer }}\" style=\"flex:1;min-width:0;height:26px;border-radius:8px;background:var(--surf2);font:600 9.5px var(--f);color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ t.nom }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"border-radius:14px;background:var(--surf);border:1px solid var(--bord);display:flex;flex-direction:column\">\n        <div style=\"display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--bord)\">\n          <div style=\"flex:1;min-width:0\"><div style=\"font:600 12.5px/1.2 var(--f);color:var(--tx)\">D\u00e9but de la progression<\u002Fdiv><div style=\"font:500 9.5px/1.3 var(--fm);color:var(--tx3);margin-top:2px\">{{ debutProgTexte }}<\u002Fdiv><\u002Fdiv>\n          <input type=\"date\" value=\"{{ debutProg }}\" sc-camel-on-change=\"{{ majDebutProg }}\" style=\"flex:none;height:30px;padding:0 8px;border-radius:9px;background:var(--surf2);border:1px solid var(--bord);font:600 11px var(--fm);color:var(--tx)\">\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--bord)\">\n          <div style=\"flex:1;min-width:0;font:600 12.5px/1.2 var(--f);color:var(--tx)\">Mode examen<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ lancerExamen }}\" style=\"height:30px;padding:0 11px;border-radius:9px;background:var(--surf2);border:1px solid var(--bord);font:600 10.5px var(--f);color:var(--tx);white-space:nowrap\">Lancer<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;padding:9px 12px\">\n          <div style=\"flex:1;min-width:0\"><div style=\"font:600 12.5px/1.2 var(--f);color:var(--tx)\">Vacances scolaires<\u002Fdiv><div style=\"font:500 9.5px/1.3 var(--fm);color:var(--tx3);margin-top:2px\">Zone C \u00b7 {{ vacResume }}<\u002Fdiv><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ basculerVac }}\" style=\"height:30px;padding:0 11px;border-radius:9px;background:{{ bgVac }};border:1px solid var(--bord);font:600 10.5px var(--f);color:{{ colVac }}\">{{ txtVac }}<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ vacOuvert }}\">\n        <div style=\"display:flex;flex-direction:column;gap:4px;padding:0 12px 10px\">\n          <sc-for list=\"{{ vacances }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;background:{{ p.bg }};border:1px solid {{ p.bord }}\">\n              <div style=\"flex:none;width:3px;height:18px;border-radius:99px;background:{{ p.trait }}\"><\u002Fdiv>\n              <div style=\"flex:none;width:62px;font:600 11.5px/1.2 var(--f);color:{{ p.col }}\">{{ p.nom }}<\u002Fdiv>\n              <div style=\"flex:1;min-width:0;font:500 9.5px/1.3 var(--fm);color:var(--tx3)\">{{ p.plage }}<\u002Fdiv>\n              <div style=\"flex:none;font:500 9.5px/1.3 var(--fm);color:var(--tx3)\">{{ p.quand }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"border-radius:14px;background:var(--surf);border:1px solid var(--bord);padding:10px 12px\">\n        <div style=\"display:flex;align-items:center;gap:8px\">\n          <div style=\"flex:1;min-width:0;font:600 12.5px/1.2 var(--f);color:var(--tx)\">Sauvegarde<\u002Fdiv>\n          <div style=\"flex:none;font:500 9.5px/1.3 var(--fm);color:var(--tx3)\">{{ resumeSauve }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:5px;margin-top:8px\">\n          <button sc-camel-on-click=\"{{ ouvrirExport }}\" style=\"flex:1;height:30px;padding:0 11px;border-radius:9px;background:var(--surf2);border:1px solid var(--bord);font:600 10.5px var(--f);color:var(--tx);white-space:nowrap\">Exporter<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ ouvrirImport }}\" style=\"flex:1;height:30px;padding:0 11px;border-radius:9px;background:var(--surf2);border:1px solid var(--bord);font:600 10.5px var(--f);color:var(--tx);white-space:nowrap\">Importer<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ annulerMaj }}\" style=\"flex:1;height:30px;padding:0 8px;border-radius:9px;background:var(--surf2);border:1px solid var(--bord);font:600 10.5px var(--f);color:{{ colAnnuler }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">\u21b6 Annuler<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ modeExport }}\">\n          <textarea value=\"{{ sauveCode }}\" sc-camel-read-only=\"{{ true }}\" style=\"width:100%;height:64px;margin-top:7px;padding:8px;border-radius:9px;background:var(--surf2);border:1px solid var(--bord);font:500 9.5px/1.4 var(--fm);color:var(--tx2);resize:none\"><\u002Ftextarea>\n          <div style=\"display:flex;gap:5px;margin-top:5px\">\n            <button sc-camel-on-click=\"{{ copier }}\" style=\"flex:1;height:30px;border-radius:9px;background:var(--tx);border:0;font:700 10.5px var(--f);color:var(--bg)\">Copier le code<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ telecharger }}\" style=\"flex:1;height:30px;padding:0 11px;border-radius:9px;background:var(--surf2);border:1px solid var(--bord);font:600 10.5px var(--f);color:var(--tx);white-space:nowrap\">Fichier .json<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ modeImport }}\">\n          <textarea value=\"{{ sauveCode }}\" sc-camel-on-change=\"{{ majSauveCode }}\" placeholder=\"Colle ici le code\" style=\"width:100%;height:64px;margin-top:7px;padding:8px;border-radius:9px;background:var(--surf2);border:1px solid var(--bord);font:500 9.5px/1.4 var(--fm);color:var(--tx);resize:none\"><\u002Ftextarea>\n          <div style=\"display:flex;gap:5px;margin-top:5px\">\n            <button sc-camel-on-click=\"{{ lancerImport }}\" style=\"flex:1;height:30px;border-radius:9px;background:var(--tx);border:0;font:700 10.5px var(--f);color:var(--bg)\">Restaurer ce code (remplace tout)<\u002Fbutton>\n            <label style=\"flex:none;display:flex;align-items:center;justify-content:center;height:30px;padding:0 11px;border-radius:9px;background:var(--surf2);border:1px solid var(--bord);font:600 10.5px var(--f);color:var(--tx);white-space:nowrap;cursor:pointer\">\n              Fichier .json\n              <input type=\"file\" accept=\".json,application/json,text/plain\" sc-camel-on-change=\"{{ choisirFichier }}\" style=\"display:none\">\n            <\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ aMsg }}\">\n          <div style=\"font:500 9.5px/1.3 var(--fm);color:var(--tx3);margin-top:7px\">{{ sauveMsg }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;gap:8px;padding:2px 2px 8px\">\n        <div style=\"flex:1;min-width:0;font:500 9.5px/1.3 var(--fm);color:var(--tx3)\">{{ piedReglages }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ demanderReinit }}\" style=\"flex:none;height:28px;padding:0 10px;border-radius:9px;background:{{ bgReinit }};border:1px solid var(--bord);font:600 10px var(--f);color:{{ colReinit }};white-space:nowrap\">{{ txtReinit }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <div style=\"flex:none;display:flex;gap:2px;padding:6px 8px 10px;background:var(--bg);border-top:1px solid var(--bord)\">\n    <sc-for list=\"{{ onglets }}\" as=\"o\" hint-placeholder-count=\"4\">\n      <button sc-camel-on-click=\"{{ o.aller }}\" style=\"flex:1;min-width:0;height:52px;border-radius:13px;background:{{ o.bg }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 3px\">\n        <div style=\"width:14px;height:3px;border-radius:99px;background:{{ o.trait }}\"><\u002Fdiv>\n        <div style=\"font:{{ o.font }} var(--f);color:{{ o.col }};text-align:center;text-wrap:balance\">{{ o.label }}<\u002Fdiv>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ sbConflit }}\">\n  <div style=\"position:absolute;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;padding:16px\">\n    <div style=\"width:100%;background:var(--surf);border:1px solid var(--bord);border-radius:20px;padding:18px\">\n      <div style=\"font:700 16px/1.25 var(--f);color:var(--tx)\">La base est plus r\u00e9cente<\u002Fdiv>\n      <div style=\"font:400 12.5px/1.45 var(--f);color:var(--tx2);margin-top:7px\">Un autre appareil a enregistr\u00e9 des notes {{ sbConflitQuand }}. Tu peux les r\u00e9cup\u00e9rer, ou garder ce qui est sur cet appareil et l'envoyer \u00e0 la place.<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:14px\">\n        <button sc-camel-on-click=\"{{ sbPrendre }}\" style=\"height:48px;border-radius:14px;background:var(--tx);color:var(--bg);font:700 12.5px var(--f)\">R\u00e9cup\u00e9rer la version de la base<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ sbGarder }}\" style=\"height:48px;border-radius:14px;background:var(--surf2);border:1px solid var(--bord);font:600 12.5px var(--f);color:var(--tx)\">Garder cet appareil et l'envoyer<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ examen }}\">\n  <div style=\"position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:26px;text-align:center\">\n    <div style=\"font:700 10px/1 var(--fm);letter-spacing:.18em;text-transform:uppercase;color:{{ couleur }}\">{{ typeLabel }}<\u002Fdiv>\n    <div style=\"font:700 24px/1.15 var(--f);color:var(--tx);letter-spacing:-.01em\">{{ matiere }}<\u002Fdiv>\n    <div style=\"font:700 clamp(58px,22vw,104px)/1 var(--fm);letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--tx)\">{{ chrono }}<\u002Fdiv>\n    <button sc-camel-on-click=\"{{ basculerRech }}\" style=\"height:40px;padding:0 16px;border-radius:12px;background:{{ bgRech }};border:1px solid {{ bordRech }};font:700 14px var(--fm);color:{{ colRech }};font-variant-numeric:tabular-nums\">{{ rechLabel }}<\u002Fbutton>\n    <div style=\"width:100%;max-width:280px;height:6px;border-radius:99px;background:var(--surf3);overflow:hidden\">\n      <div style=\"height:100%;border-radius:99px;background:{{ couleur }};width:{{ pct }}%\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font:500 11.5px/1.4 var(--fm);color:var(--tx3)\">{{ horaire }} \u00b7 {{ sousChrono }}<\u002Fdiv>\n    <button sc-camel-on-click=\"{{ quitterExamen }}\" style=\"height:48px;padding:0 24px;border-radius:14px;background:var(--surf2);border:1px solid var(--bord);font:600 12.5px var(--f);color:var(--tx2);margin-top:10px\">Quitter le mode examen<\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ enPause }}\">\n  <div style=\"position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center\">\n    <div style=\"font:700 11px/1 var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);animation:bat 2.4s ease-in-out infinite\">En pause<\u002Fdiv>\n    <div style=\"font:400 clamp(44px,15vw,64px)/1 var(--fm);color:var(--tx);font-variant-numeric:tabular-nums\">{{ pauseEcoule }}<\u002Fdiv>\n    <div style=\"font:400 12.5px/1.45 var(--f);color:var(--tx2);max-width:270px\">Les alarmes sont coup\u00e9es. L'emploi du temps continue \u00e0 l'heure r\u00e9elle : rien n'est d\u00e9cal\u00e9.<\u002Fdiv>\n    <div style=\"font:500 11.5px/1.4 var(--fm);color:var(--tx3)\">En cours : {{ matiere }} \u00b7 {{ chrono }}<\u002Fdiv>\n    <button sc-camel-on-click=\"{{ basculerPause }}\" style=\"height:54px;padding:0 28px;border-radius:16px;background:var(--tx);color:var(--bg);font:700 14px var(--f);margin-top:4px\">Reprendre<\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:900},&quot;themeDefaut&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sombre&quot;,&quot;clair&quot;],&quot;default&quot;:&quot;sombre&quot;,&quot;tsType&quot;:&quot;'sombre' | 'clair'&quot;,&quot;section&quot;:&quot;Comportement&quot;},&quot;preavisMinutes&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;min&quot;:1,&quot;max&quot;:10,&quot;unit&quot;:&quot; min&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Comportement&quot;},&quot;sonParDefaut&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Comportement&quot;}}\">\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   1. DONN\u00c9ES \u2014 emploi du temps hebdomadaire (semaine type),\n      une seule mati\u00e8re par bloc, aucune sous-partie.\n   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255  { debut: \"10:40\", fin: \"12:00\", matiere: \"Physique/Chimie\",   type: \"travail\" },\n    { debut: \"12:00\", fin: \"12:45\", matiere: \"D\u00e9jeuner\",          type: \"repas\" },\n    { debut: \"12:45\", fin: \"14:15\", matiere: \"TIPE\",              type: \"travail\" },\n    { debut: \"14:30\", fin: \"16:00\", matiere: \"Physique/Chimie\",   type: \"etude\" },\n    { debut: \"16:00\", fin: \"16:30\", matiere: \"SI\",                type: \"etude\" },\n    { debut: \"16:45\", fin: \"17:30\", matiere: \"SI\",                type: \"etude\" },\n    { debut: \"17:30\", fin: \"18:30\", matiere: \"Math\u00e9matiques\",     type: \"etude\" },\n    { debut: \"18:30\", fin: \"19:00\", matiere: \"Math\u00e9matiques\",     type: \"travail\" },\n    { debut: \"19:00\", fin: \"20:15\", matiere: \"D\u00eener\",             type: \"repas\" },\n    { debut: \"20:15\", fin: \"20:30\", matiere: \"Rangement + sport\", type: \"routine\" },\n    { debut: \"20:30\", fin: \"21:00\", matiere: \"Anki\",              type: \"anki\" },\n    { debut: \"21:00\", fin: \"21:45\", matiere: \"Informatique\",      type: \"travail\" },\n    { debut: \"21:45\", fin: \"22:30\", matiere: \"Anki\",              type: \"anki\" },\n    { debut: \"22:30\", fin: \"23:00\", matiere: \"Fran\u00e7ais\",          type: \"travail\" }\n  ] }\n];\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   2. LOGIQUE \u2014 horloge r\u00e9elle, alarmes, notes, progression\n   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\ t net = normaliser(blocsSrc(idx, s.edits, isoL));\n      net = maj(net) || net;\n      net = normaliser(net.filter((b) => b).sort((a, b) => hm2min(a.debut || \"00:00\") - hm2min(b.debut || \"00:00\")));\n      const perm = Object.assign({}, s.edits.perm), sem = Object.assign({}, s.edits.sem);\n      if (s.portee === \"vie\" && s.varianteActive && s.variantes[s.varianteActive]) {\n        const vs = Object.assign({}, s.variantes);\n        const cur = vs[s.varianteActive];\n        vs[s.varianteActive] = { nom: cur.nom, jours: Object.assign({}, cur.jours, { [idx]: net }) };\n        if (sem[isoL]) { const w = Object.assign({}, sem[isoL]); delete w[idx]; sem[isoL] = w; }\n        return { variantes: vs, edits: { perm: perm, sem: sem } };\n      }\n      if (s.portee === \"vie\") {\n        perm[idx] = net;\n        if (sem[isoL]) { const w = Object.assign({}, sem[isoL]); delete w[idx]; sem[isoL] = w; }\n      } else {\n        const w = Object.assign({}, sem[isoL] || {}); w[idx] = net; sem[isoL] = w;\n      }\n      return { edits: { perm: perm, sem: sem } };\n    });\n  }\n  retablirJour(idx) {\n    const isoL = this.semaineIso();\n    this.setState((s) => {\n      const perm = Object.assign({}, s.edits.perm), sem = Object.assign({}, s.edits.sem);\n      if (s.portee === \"vie\") delete perm[idx];\n      if (sem[isoL]) { const w = Object.assign({}, sem[isoL]); delete w[idx]; sem[isoL] = w; }\n      return { edits: { perm: perm, sem: sem } };\n    });\n  }\n\n  courant(now) {\n    const d = new Date(now);\n    const idx = idxJour(d);\n    const blocs = this.jours(idx, d);\n    for (let i = 0; i < blocs.length; i++) {\n      const b = blocs[i], deb = ancre(d, b.dMin), fin = ancre(d, b.fMin);\n      if (now >= deb && now < fin) return { idx: idx, bloc: b, debutTs: deb, finTs: fin, suivant: blocs[i + 1] || null, i: i };\n      if (now < deb) return { idx: idx, bloc: null, debutTs: null, finTs: deb, suivant: b, i: i };\n    }\n    return { idx: idx, bloc: null, debutTs: null, finTs: null, suivant: null, i: blocs.length };\n  }\n\n  tick() {\n    majRegistre(this.state.mats);\n    this.majVariante();\n    const now = Date.now();\n    const cur = this.courant(now);\n    const cle = cur.bloc ? iso(new Date(now)) + \"|\" + cur.bloc.cle : \"vide|\" + iso(new Date(now)) + \"|\" + cur.i;\n    const prea = Math.max(1, this.props.preavisMinutes || 2) * 60000;\n    if (this.dernier === undefined) {\n      this.dernier = cle;\n      if (cur.bloc && cur.finTs - now <= prea) this.avertis[cle] = 1;\n    } else if (cle !== this.dernier) {\n      if (!this.state.pause) {\n        const arrive = cur.bloc;\n        const doux = arrive && (arrive.type === \"pause\" || arrive.type === \"repas\" || arrive.type === \"routine\");\n        this.jouer(doux ? \"reprise\" : \"fin\");\n        this.vibrer(doux ? [170, 80, 170] : [220, 90, 220, 90, 400]);\n        this.notifier(arrive);\n      }\n      this.dernier = cle;\n    } else if (cur.bloc && this.state.reglages.preavis && !this.avertis[cle] && cur.finTs - now <= prea) {\n      this.avertis[cle] = 1;\n      if (!this.state.pause) { this.jouer(\"avert\"); this.vibrer([90]); }\n    }\n    /* Ne re-rendre en continu que l\u00e0 o\u00f9 une seconde compte : ailleurs, un\n       re-render toutes les 500 ms \u00e9crasait les s\u00e9lecteurs pendant la saisie. */\n    const jourNow = iso(new Date(now));\n    if (this.dernierJour && this.dernierJour !== jourNow) { this.resetRecurrences(); this.reportAuto(); }\n    this.dernierJour = jourNow;\n    const st = this.state;\n    if (st.onglet === \"maintenant\" || st.pause) { this.setState((s) => ({ tick: s.tick + 1 })); return; }\n    const minute = Math.floor(now / 60000);\n    if (minute !== this.derniereMinute && st.precis === null && st.dateEdit === null) {\n      this.derniereMinute = minute;\n      this.setState((s) => ({ tick: s.tick + 1 }));\n    }\n  }\n\n  majReglage(k, v) {\n    this.setState((st) => ({ reglages: Object.assign({}, st.reglages, { [k]: v }) }));\n    if (k === \"volume\" && this.gain) this.gain.gain.value = v;\n  }\n\n  async activerSon() {\n    const ok = this.initAudio();\n    this.setState({ sonOk: !!ok, reglages: Object.assign({}, this.state.reglages, { son: true }) });\n    if (ok) setTimeout(() => this.jouer(\"reprise\"), 40);\n    try { if (\"Notification\" in window && Notification.permission === \"default\") await Notification.requestPermission(); } catch (e) {}\n    this.veille();\n  }\n\n  /* ---------- semaines type alternatives ---------- */\n  majVariante() {\n    const st = this.state;\n    const v = st.varianteActive && st.variantes[st.varianteActive] ? st.variantes[st.varianteActive] : null;\n    if (v !== VARIANTE) { VARIANTE = v; REG_V++; }\n  }\n\n  /* ---------- r\u00e9currence ---------- */\n  /* Une t\u00e2che \"tous les jours\" se red\u00e9coche d\u00e8s le lendemain, une t\u00e2che\n     \"chaque semaine\" d\u00e8s le lundi suivant. Rien n'est supprim\u00e9. */\n  resetRecurrences() {\n    const auj = iso(new Date());\n    const lun = iso(lundiDe(new Date()));\n    this.setState((s) => {\n      const n = {}; let change = false;\n      Object.keys(s.notes).forEach((k) => {\n        n[k] = (s.notes[k] || []).map((x) => {\n          if (!x.recur || !x.fait) return x;\n          const perime = x.recur === \"jour\" ? x.faitLe !== auj : iso(lundiDe(jourISO(x.faitLe || auj))) !== lun;\n          if (!perime) return x;\n          change = true;\n          return Object.assign({}, x, { fait: false, faitLe: null });\n        });\n      });\n      return change ? { notes: n } : null;\n    });\n  }\n\n  /* ---------- report automatique ---------- */\n  reportAuto() {\n    const auj = iso(new Date());\n    const limite = Date.now() - 14 * 86400000;\n    this.setState((s) => {\n      if (s.reglages.report === false) return null;\n      const n = {}; let change = false;\n      Object.keys(s.notes).forEach((k) => {\n        n[k] = (s.notes[k] || []).map((x) => {\n          if (!x.ajout) { change = true; return Object.assign({}, x, { ajout: auj }); }\n          if (x.fait || x.option || x.important) return x;\n          if (new Date(x.ajout + \"T00:00:00\").getTime() > limite) return x;\n          change = true;\n          return Object.assign({}, x, { option: true, reporte: true });\n        });\n      });\n      return change ? { notes: n } : null;\n    });\n  }\n\n  /* ---------- synchronisation ----------\n     Local d'abord : rien ne d\u00e9pend du r\u00e9seau. L'envoi est diff\u00e9r\u00e9 de 5 s apr\u00e8s\n     le dernier changement, et repris automatiquement au retour de la connexion.\n     Jamais d'\u00e9crasement silencieux : si la base est plus r\u00e9cente que la\n     derni\u00e8re synchro de cet appareil, l'app demande quoi garder. */\n  async sbAppel(fonction, corps) {\n    const rep = await fetch(SB_URL + \"/rest/v1/rpc/\" + fonction, {\n      method: \"POST\",\n      headers: { apikey: SB_KEY, Authorization: \"Bearer \" + SB_KEY, \"Content-Type\": \"application/json\" },\n      body: JSON.stringify(corps)\n    });\n    const txt = await rep.text();\n    if (!rep.ok) {\n      let m = \"erreur \" + rep.status;\n      try { const j = JSON.parse(txt); if (j.message) m = j.message; } catch (e) {}\n      throw new Error(m);\n    }\n    return txt ? JSON.parse(txt) : null;\n  }\n  /* les r\u00e9glages restent propres \u00e0 chaque appareil : ils ne partent pas */\n  sbDonnees() {\n    const st = this.state;\n    return { app: \"psi-edt\", v: 4, notes: st.notes, coches: st.coches, edits: st.edits,\n      ajust: st.ajust, mats: st.mats, variantes: st.variantes, varianteActive: st.varianteActive };\n  }\n  sbHeure() { return new Date().toLocaleTimeString(\"fr-FR\", { hour: \"2-digit\", minute: \"2-digit\" }); }\n  async sbEnvoyer(manuel) {\n    const code = (this.state.reglages.sbCode || \"\").trim();\n    if (!code) { if (manuel) this.setState({ sbEtat: \"Choisis d'abord un code de synchro.\" }); return; }\n    if (this.sbOccupe) { this.sbAttente = true; return; }\n    this.sbOccupe = true;\n    if (manuel) this.setState({ sbEtat: \"Envoi\u2026\" });\n    try {\n      const t = await this.sbAppel(\"ecrire_sauvegarde\", { p_code: code, p_data: this.sbDonnees() });\n      this.sbAttente = false;\n      this.majReglage(\"sbMaj\", typeof t === \"string\" ? t : new Date().toISOString());\n      this.setState({ sbEtat: \"Envoy\u00e9 \u00e0 \" + this.sbHeure() + \".\" });\n    } catch (e) {\n      this.sbAttente = true;\n      this.setState({ sbEtat: navigator.onLine === false ? \"Hors ligne \u2014 envoi au retour du r\u00e9seau.\" : \"Envoi impossible : \" + e.message });\n    }\n    this.sbOccupe = false;\n  }\n  async sbLire(manuel) {\n    const code = (this.state.reglages.sbCode || \"\").trim();\n    if (!code) { if (manuel) this.setState({ sbEtat: \"Choisis d'abord un code de synchro.\" }); return null; }\n    if (manuel) this.setState({ sbEtat: \"Lecture\u2026\" });\n    try {\n      const r = await this.sbAppel(\"lire_sauvegarde\", { p_code: code });\n      const ligne = Array.isArray(r) ? r[0] : r;\n      if (!ligne || !ligne.data) { this.setState({ sbEtat: \"Aucune sauvegarde sous ce code.\" }); return null; }\n      return ligne;\n    } catch (e) {\n      this.setState({ sbEtat: navigator.onLine === false ? \"Hors ligne \u2014 impossible de lire la base.\" : \"Lecture impossible : \" + e.message });\n      return null;\n    }\n  }\n  sbAppliquer(ligne) {\n    try {\n      this.importer(btoa(unescape(encodeURIComponent(JSON.stringify(ligne.data)))));\n      this.majReglage(\"sbMaj\", ligne.maj);\n      this.sigSync = undefined;\n      this.setState({ sbConflit: null, sbEtat: \"R\u00e9cup\u00e9r\u00e9 depuis la base \u00e0 \" + this.sbHeure() + \".\" });\n    } catch (e) { this.setState({ sbConflit: null, sbEtat: \"Donn\u00e9es distantes illisibles.\" }); }\n  }\n  async sbVerifier() {\n    const r = this.state.reglages;\n    if (!r.sbCode || !r.sbAuto) return;\n    const ligne = await this.sbLire(false);\n    if (!ligne) return;\n    const distant = new Date(ligne.maj).getTime();\n    const local = r.sbMaj ? new Date(r.sbMaj).getTime() : 0;\n    if (distant > local + 1500) this.setState({ sbConflit: ligne });\n    else this.setState({ sbEtat: \"\u00c0 jour avec la base.\" });\n  }\n  sbPlanifier() {\n    const r = this.state.reglages;\n    if (!r.sbCode || !r.sbAuto) return;\n    clearTimeout(this.sbT);\n    this.sbT = setTimeout(() => this.sbEnvoyer(false), 5000);\n  }\n\n  /* ---------- sauvegarde ---------- */\n  exporter() {\n    const st = this.state;\n    const d = { app: \"psi-edt\", v: 4, notes: st.notes, coches: st.coches, reglages: st.reglages,\n      edits: st.edits, ajust: st.ajust, mats: st.mats, variantes: st.variantes, varianteActive: st.varianteActive };\n    try { return btoa(unescape(encodeURIComponent(JSON.stringify(d)))); } catch (e) { return \"\"; }\n  }\n  /* Import tol\u00e9rant : il accepte toute version pass\u00e9e ou future du code.\n     Chaque partie est v\u00e9rifi\u00e9e s\u00e9par\u00e9ment \u2014 une partie inconnue ou ab\u00eem\u00e9e\n     est ignor\u00e9e sans faire \u00e9chouer le reste, et rien n'est jamais perdu\n     silencieusement (les mati\u00e8res absentes sont recr\u00e9\u00e9es). */\n  importer(code) {\n    let d = null;\n    try { d = JSON.parse(decodeURIComponent(escape(atob((code || \"\").trim())))); } catch (e) { d = null; }\n    const obj = (x) => x && typeof x === \"object\" && !Array.isArray(x);\n    if (!obj(d)) { this.setState({ sauveMsg: \"Code illisible \u2014 v\u00e9rifie qu'il est copi\u00e9 en entier.\" }); return; }\n    if (d.app && d.app !== \"psi-edt\") { this.setState({ sauveMsg: \"Ce code vient d'une autre application.\" }); return; }\n    if (!obj(d.notes) && !obj(d.coches)) { this.setState({ sauveMsg: \"Ce code ne contient aucune donn\u00e9e reconnue.\" }); return; }\n\n    const maj = { sauveMode: null, sauveCode: \"\" };\n    const bilan = [];\n    const auj = iso(new Date());\n\n    /* notes : t\ , iso(lundiDe(new Date())));\n          this.setState({ sauveMsg: \"Fichier enregistr\u00e9.\" });\n        } catch (e) { this.setState({ sauveMsg: \"T\u00e9l\u00e9chargement refus\u00e9 \u2014 utilise le code \u00e0 copier.\" }); }\n      };\n      /* import fichier : accepte le .json comme le code brut */\n      v.choisirFichier = (e) => {\n        const f = e.target.files && e.target.files[0];\n        if (!f) return;\n        const rd = new FileReader();\n        rd.onload = () => {\n          const t = String(rd.result || \"\").trim();\n          let code = t;\n          if (t.charAt(0) === \"{\") {\n            try { code = btoa(unescape(encodeURIComponent(t))); } catch (err) { code = t; }\n          }\n          this.importer(code);\n        };\n        rd.onerror = () => this.setState({ sauveMsg: \"Fichier illisible.\" });\n        rd.readAsText(f);\n        e.target.value = \"\";\n      };\n      const nbT = Object.keys(st.notes).reduce((a, k) => a + (st.notes[k] || []).length, 0);\n      v.resumeSauve = nbT + \" t\u00e2che(s) \u00b7 \" + Object.keys(st.coches).length + \" jour(s) coch\u00e9(s)\";\n      v.txtReinit = st.confirmReinit ? \"Confirmer : tout effacer\" : \"R\u00e9initialiser (notes et cases coch\u00e9es)\";\n      v.bgReinit = st.confirmReinit ? \"var(--dang)\" : \"transparent\";\n      v.colReinit = st.confirmReinit ? \"#fff\" : \"var(--dang)\";\n      v.demanderReinit = () => {\n        if (st.confirmReinit) { try { localStorage.removeItem(CLE); } catch (e) {} this.setState({ notes: {}, coches: {}, confirmReinit: false }); }\n        else { this.setState({ confirmReinit: true }); setTimeout(() => this.setState({ confirmReinit: false }), 5000); }\n      };\n    }\n\n    return v;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
